services:
  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - NODE_ENV=development
    command: npm start

  frontend:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      - VITE_SOCKET_URL=http://localhost:5000
    command: npm run preview
    depends_on:
      - backend
